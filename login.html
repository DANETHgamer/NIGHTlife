<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NIGHTlife - Login</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  background: #090711;
  color: white;
  font-family: Arial, sans-serif;
  padding: 20px;
}
.container {
  width: 100%;
  max-width: 400px;
  padding: 30px;
  background: #171323;
  border-radius: 16px;
  box-shadow: 0 0 25px #9333ea33;
}
h1 { color: #a855f7; text-align: center; }
h2 { text-align: center; }
input, button {
  width: 100%;
  padding: 14px;
  margin-top: 15px;
  border-radius: 10px;
  font-size: 16px;
}
input {
  border: 1px solid #49365f;
  background: #241b32;
  color: white;
}
button {
  border: none;
  background: #9333ea;
  color: white;
  cursor: pointer;
}
#mensagem {
  text-align: center;
  overflow-wrap: anywhere;
}
</style>
</head>
<body>

<div class="container">
  <h1>NIGHTlife</h1>
  <h2>Entrar na sua conta</h2>

  <form id="formLogin">
    <input id="email" type="email" placeholder="Seu e-mail" required>
    <input id="senha" type="password" placeholder="Sua senha" required>
    <button id="botao" type="submit">Entrar</button>
  </form>

  <p id="mensagem"></p>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = "https://crmfxxsrhdncvaaxezvz.supabase.co";
const SUPABASE_KEY = "sb_publishable_xItZ3WXBgTbXIE67HzvDlQ_vjMjza2Q";

const supabaseClient = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

document.getElementById("formLogin").addEventListener("submit", async (event) => {
  event.preventDefault();

  const mensagem = document.getElementById("mensagem");
  const botao = document.getElementById("botao");

  botao.disabled = true;
  mensagem.textContent = "Verificando acesso...";

  const email = document.getElementById("email").value.trim();
  const senha = document.getElementById("senha").value;

  const { data, error } = await supabaseClient.auth.signInWithPassword({
    email: email,
    password: senha
  });

  if (error) {
    mensagem.textContent = "Erro ao entrar: " + error.message;
    botao.disabled = false;
    return;
  }

  mensagem.textContent = "Login realizado! Verificando seu nível de acesso...";

  const { data: acesso, error: acessoError } = await supabaseClient.rpc("nightlife_obter_nivel_acesso");
  if (acessoError) {
    mensagem.textContent = "Não foi possível verificar as permissões. Execute a migration de administração regional no Supabase. " + acessoError.message;
    botao.disabled = false;
    return;
  }

  if (acesso?.nivel === "supremo") {
    window.location.href = "painel.html";
  } else if (acesso?.nivel === "regional") {
    window.location.href = "central-controle.html";
  } else {
    window.location.href = "painel-proprietario.html";
  }
});
</script>

</body>
</html>
