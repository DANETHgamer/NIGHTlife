<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#080808"><title>NIGHTlife | Nova senha</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800;900&family=Oswald:wght@400;500;600;700&family=Pacifico&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;background:radial-gradient(ellipse at 50% 0%,#351018 0,#080808 62%);color:#eee;font-family:Arial,sans-serif}
main{width:min(100%,440px);padding:30px;background:linear-gradient(145deg,#1c1c1c,#101010);border:1px solid #444;border-top:3px solid #ff1738;border-radius:16px;box-shadow:0 18px 55px #000b}
.logo{text-align:center;font:900 clamp(30px,8vw,42px) Orbitron,sans-serif;color:#e5e5e5}.logo span{font:normal 1em Pacifico,cursive;color:#ff1738}
.slogan{text-align:center;margin:10px 0 25px;font:16px Oswald,sans-serif;letter-spacing:4px;text-transform:uppercase;color:#ddd}
h1{text-align:center;font:600 24px Oswald,sans-serif;text-transform:uppercase;margin:0 0 18px}p{color:#bbb;line-height:1.5;text-align:center}
label{display:block;margin:14px 0 6px;color:#ccc;font:600 14px Oswald,sans-serif}
input{width:100%;padding:14px;border:1px solid #555;border-radius:8px;background:#090909;color:#fff;font-size:16px}
button{width:100%;padding:14px;margin-top:18px;border:1px solid #ff526b;border-radius:8px;background:linear-gradient(135deg,#ff1738,#a80020);color:#fff;font-size:16px;font-weight:bold;cursor:pointer}
button:disabled{opacity:.6;cursor:wait}#mensagem{min-height:42px;color:#ffb7c1;overflow-wrap:anywhere}.voltar{display:block;text-align:center;margin-top:12px;color:#bbb;text-decoration:none}
</style></head><body><main>
<div class="logo">NIGHT<span>life</span></div><div class="slogan">A noite começa aqui</div>
<h1>Crie uma nova senha</h1><p>Escolha uma senha segura para voltar à sua conta.</p>
<form id="formSenha">
<label for="senha">Nova senha</label><input id="senha" type="password" minlength="8" autocomplete="new-password" placeholder="Mínimo de 8 caracteres" required>
<label for="confirmar">Confirme a nova senha</label><input id="confirmar" type="password" minlength="8" autocomplete="new-password" placeholder="Digite novamente" required>
<button id="salvar" type="submit">Salvar nova senha</button></form>
<p id="mensagem" role="status" aria-live="polite">Validando o link de recuperação...</p>
<a class="voltar" href="login.html">Voltar para o login</a></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
"use strict";
const db=window.supabase.createClient("https://crmfxxsrhdncvaaxezvz.supabase.co","sb_publishable_xItZ3WXBgTbXIE67HzvDlQ_vjMjza2Q",{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
const form=document.getElementById("formSenha"),botao=document.getElementById("salvar"),mensagem=document.getElementById("mensagem");
(async()=>{const {data,error}=await db.auth.getSession();if(error||!data.session){mensagem.textContent="Link inválido ou expirado. Volte ao login e solicite uma nova recuperação.";botao.disabled=true;return;}mensagem.textContent="Link validado. Informe sua nova senha.";})();
form.addEventListener("submit",async e=>{e.preventDefault();const senha=document.getElementById("senha").value,confirmar=document.getElementById("confirmar").value;if(senha.length<8){mensagem.textContent="A senha precisa ter pelo menos 8 caracteres.";return;}if(senha!==confirmar){mensagem.textContent="As senhas não coincidem.";return;}botao.disabled=true;mensagem.textContent="Atualizando sua senha...";const {error}=await db.auth.updateUser({password:senha});if(error){mensagem.textContent="Não foi possível atualizar a senha: "+error.message;botao.disabled=false;return;}mensagem.textContent="Senha atualizada! Você já pode entrar com a nova senha.";form.reset();botao.textContent="Senha salva";});
</script></body></html>
